name: Apply contribution

# Turn a "contribution"-labelled issue (filed by the TMSync extension's contribute
# button) into a ready-to-merge PR: parse the self-describing JSON payload, route
# each entry into the right recipe list, format with biome, and open a PR closing
# the issue. A human reviews + merges. No backend (constraint #7): this is repo CI,
# not a hosted server.
#
# The label is the gate. Only a maintainer can add a label, so an issue from anyone
# else waits until a maintainer checks it and adds "contribution". A maintainer's
# own issue carries the label from the extension's link and runs at once.
#
# Needs Settings > Actions > "Allow GitHub Actions to create and approve pull requests".

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write # tell the contributor where their PR is

jobs:
  apply:
    # Fire when a maintainer adds the "contribution" label, OR when a maintainer
    # opens an issue that already carries it (creating-with-label doesn't reliably
    # emit `labeled`). The author check keeps the gate even if GitHub ever applies
    # the link's label for an outside author.
    if: >
      (github.event.action == 'labeled' && github.event.label.name == 'contribution') ||
      (github.event.action == 'opened' &&
        contains(github.event.issue.labels.*.name, 'contribution') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply contribution payload
        id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/apply-contribution.mjs

      - name: Format recipe lists
        run: pnpm exec biome format --write recipes/ || true

      - name: Open pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          # Content-keyed for a single-site contribution (re-contributing the same
          # site updates its PR); falls back to the issue number for a bundle.
          branch: ${{ steps.apply.outputs.branch }}
          delete-branch: true
          # The title becomes a release-notes line: it names the site in plain words.
          title: ${{ steps.apply.outputs.title }}
          commit-message: ${{ steps.apply.outputs.commit }}
          body: |
            Closes #${{ github.event.issue.number }}

            Contributed by @${{ github.event.issue.user.login }} from the TMSync extension. A bot made this PR from the issue. Review and merge.

            ${{ steps.apply.outputs.summary }}
          labels: contribution

      - name: Tell the contributor
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
        run: |
          if [ "$OPERATION" = "updated" ]; then
            msg="Thanks. I updated the pull request with this change: $PR_URL"
          else
            msg="Thanks. I opened a pull request with your contribution: $PR_URL"
          fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$msg

          After review and merge, it reaches every TMSync user with the next library sync. This issue closes when the pull request merges."
